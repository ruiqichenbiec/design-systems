<!doctype html><html data-theme="stage"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
<script src="../assets/bundle.js"></script>
<style>html,body{margin:0;background:transparent}html{overflow:hidden}body{padding:0;font-family:var(--font-sans)}</style>
<script>
addEventListener('message',e=>{if(e.data&&e.data.dsTheme)document.documentElement.dataset.theme=e.data.dsTheme;});
(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
addEventListener('load',function(){var post=function(){parent.postMessage({dsFrame:"show-roll",h:Math.ceil(Math.max(document.documentElement.scrollHeight,document.body.scrollHeight))},'*');};post();try{new ResizeObserver(post).observe(document.body);}catch(e){}});
addEventListener('error',function(e){parent.postMessage({dsFrame:"show-roll",err:String(e.message||e)},'*');});
</script></head><body>
<style>
.roll{background:var(--ov-bg);color:var(--ov-text);padding:34px 36px 30px;position:relative;isolation:isolate;overflow:hidden}
.roll:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 55% 45% at 24% 50%,color-mix(in srgb,var(--ov-cold) 15%,transparent),transparent 70%)}
.roll h3{font:400 clamp(56px,9vw,120px)/.9 var(--font-display);letter-spacing:-.045em;margin:0 0 14px}
.roll .ov-roll{--roll-h:440px;--frame-w:230px}.roll .ov-roll__meta,.roll .ov-roll__table{padding-left:0;padding-right:0;margin-left:0;margin-right:0}
@media(max-width:700px){.roll{padding:24px 16px}.roll .ov-roll{--roll-h:300px;--frame-w:150px}}
</style>
<div class="ov roll" data-theme="nocturne"><h3>THE ROLL</h3><div id="roll"></div></div>
<script>
Overture.configure({assetBase: '../assets/'});
Overture.mount('FilmCanister', '#roll', {pulled: 3.3});
</script>

</body></html>
