<!doctype html><html data-theme="night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
<script src="../assets/bundle.js"></script>
<style>html,body{margin:0;background:transparent}html{overflow:hidden}body{padding:0;font-family:system-ui,sans-serif}</style>
<script>
addEventListener('message',e=>{if(e.data&&e.data.dsTheme)document.documentElement.dataset.theme=e.data.dsTheme;});
(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
addEventListener('load',function(){var post=function(){parent.postMessage({dsFrame:"Switch",h:Math.ceil(Math.max(document.documentElement.scrollHeight,document.body.scrollHeight))},'*');};post();try{new ResizeObserver(post).observe(document.body);}catch(e){}});
addEventListener('error',function(e){parent.postMessage({dsFrame:"Switch",err:String(e.message||e)},'*');});
</script></head><body>
<div class="lx-pv"><div class="pv-col"><button class="lx-switch lx-switch--lg" id="demo" aria-checked="false"><span class="lx-switch__track"></span><span>Phase<small>flips itself until you press it</small></span></button><button class="lx-switch" aria-checked="false"><span class="lx-switch__track"></span><span>Sound<small>synthesized, quiet</small></span></button><button class="lx-switch" aria-checked="true"><span class="lx-switch__track"></span><span>Auto-advance<small>after 11 s without input</small></span></button></div></div>
<script>
(function(){
  document.querySelectorAll('.lx-switch').forEach(window.Lattice.mountSwitch); var d = document.getElementById('demo'); setInterval(function(){ if (!d._touched) d._switch.set(!d._switch.on, { quiet: true }); }, 2600);
})();
</script>

</body></html>
