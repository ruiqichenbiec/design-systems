<!doctype html><html data-theme="night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
<script src="../assets/bundle.js"></script>
<style>html,body{margin:0;background:transparent}html{overflow:hidden}body{padding:0;font-family:system-ui,sans-serif}</style>
<script>
addEventListener('message',e=>{if(e.data&&e.data.dsTheme)document.documentElement.dataset.theme=e.data.dsTheme;});
(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
addEventListener('load',function(){var post=function(){parent.postMessage({dsFrame:"DotText",h:Math.ceil(Math.max(document.documentElement.scrollHeight,document.body.scrollHeight))},'*');};post();try{new ResizeObserver(post).observe(document.body);}catch(e){}});
addEventListener('error',function(e){parent.postMessage({dsFrame:"DotText",err:String(e.message||e)},'*');});
</script></head><body>
<div class="lx-pv"><span id="d" style="display:inline-block">043</span><div class="pv-row" style="margin-top:14px"><button class="lx-btn lx-btn--ghost" id="u">+ 1</button><button class="lx-btn lx-btn--ghost" id="q">Say QED</button></div></div>
<script>
(function(){
  var L = window.Lattice; var n = 43; var d = L.mountDotText(document.getElementById('d'), { pitch: 7 }); document.getElementById('u').onclick = function(){ n = (n + 1) % 1000; d.set(String(n).padStart(3, '0')); }; document.getElementById('q').onclick = function(){ d.set('QED'); };
})();
</script>

</body></html>
