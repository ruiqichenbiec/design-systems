<!doctype html><html data-theme="night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
<script src="../assets/bundle.js"></script>
<style>html,body{margin:0;background:transparent}html{overflow:hidden}body{padding:0;font-family:system-ui,sans-serif}</style>
<script>
addEventListener('message',e=>{if(e.data&&e.data.dsTheme)document.documentElement.dataset.theme=e.data.dsTheme;});
(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
addEventListener('load',function(){var post=function(){parent.postMessage({dsFrame:"Slider",h:Math.ceil(Math.max(document.documentElement.scrollHeight,document.body.scrollHeight))},'*');};post();try{new ResizeObserver(post).observe(document.body);}catch(e){}});
addEventListener('error',function(e){parent.postMessage({dsFrame:"Slider",err:String(e.message||e)},'*');});
</script></head><body>
<div class="lx-pv"><div class="lx-range"><span>Flow</span><div class="lx-slider"><input type="range" min="0" max="100" value="42" aria-label="Flow"></div><output id="o">42</output></div></div>
<script>
(function(){
  var i = document.querySelector('.lx-slider input'); window.Lattice.mountSlider(i); i.addEventListener('input', function(){ document.getElementById('o').textContent = i.value; });
})();
// the system's cursor: over any control the set of points re-forms along its outline
window.Lattice.mountCursor();
</script>

</body></html>
