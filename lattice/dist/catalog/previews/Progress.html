<!doctype html><html data-theme="night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
<script src="../assets/bundle.js"></script>
<style>html,body{margin:0;background:transparent}html{overflow:hidden}body{padding:0;font-family:system-ui,sans-serif}</style>
<script>
addEventListener('message',e=>{if(e.data&&e.data.dsTheme)document.documentElement.dataset.theme=e.data.dsTheme;});
(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
addEventListener('load',function(){var post=function(){parent.postMessage({dsFrame:"Progress",h:Math.ceil(Math.max(document.documentElement.scrollHeight,document.body.scrollHeight))},'*');};post();try{new ResizeObserver(post).observe(document.body);}catch(e){}});
addEventListener('error',function(e){parent.postMessage({dsFrame:"Progress",err:String(e.message||e)},'*');});
</script></head><body>
<div class="lx-pv"><div class="lx-progress" id="p" data-value="0.62" aria-label="Demo progress"></div><div class="lx-progress" data-indeterminate aria-label="Working" style="margin-top:8px"></div><div class="pv-row" style="margin-top:12px"><button class="lx-btn lx-btn--ghost" id="a">Empty</button><button class="lx-btn lx-btn--ghost" id="b">Fill</button></div></div>
<script>
(function(){
  var L = window.Lattice; var p = L.mountProgress(document.getElementById('p')); document.querySelectorAll('[data-indeterminate]').forEach(L.mountProgress); var manual = false; document.getElementById('a').onclick = function(){ manual = true; p.set(0); }; document.getElementById('b').onclick = function(){ manual = true; p.set(1); }; (function tick(){ if (!manual) { var v = p.value >= 1 ? 0 : Math.min(1, p.value + 0.07 + Math.random() * 0.09); p.set(v); } setTimeout(tick, p.value >= 1 ? 2600 : p.value === 0 ? 1400 : 1050); })();
})();
</script>

</body></html>
