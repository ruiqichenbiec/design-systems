<!-- @dsCard group="Overlays" height=150 subtitle="⌘K: every action on the page, marked by a small swarm" -->
<div class="lx-pv"><p class="pv-note">Opens as a modal dialog. Try ⌘K / Ctrl+K inside this card, or the button.</p><div class="pv-row"><button class="lx-btn lx-btn--primary" id="o">Open commands</button></div><p class="pv-note" id="r"></p></div>
<script>
(function(){
  var c = window.Lattice.mountCommands([{id:'a', key:'下', en:'Next set', run:function(){ document.getElementById('r').textContent = 'Ran: Next set'; }}, {id:'b', key:'树', en:'Grow the proof of Picard–Lindelöf', run:function(){ document.getElementById('r').textContent = 'Ran: Grow a proof'; }}, {id:'c', key:'声', en:'Toggle sound', run:function(){ document.getElementById('r').textContent = 'Ran: Toggle sound'; }}]); document.getElementById('o').onclick = c.open;
})();
// the system's cursor: over any control the set of points re-forms along its outline
window.Lattice.mountCursor();
</script>
